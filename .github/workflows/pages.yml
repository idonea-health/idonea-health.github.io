# Publishes this repo to https://idonea-health.github.io/ (Pages source: GitHub Actions), which https://kylohealth.ai
# serves through a Cloudflare Worker (cloudflare/worker.js). The product is Kylo (Kylo Health).
#   /            index.html: a short public letter (vision only)
#   /signin.html role choice; each goes to https://app.kylohealth.ai (Cloudflare Worker kylo-app behind Access)
#   /demo/       only a redirect to /signin.html; the demo itself is no longer published here
#   /jwks.json   Kylo's public signing key for ModMed Bulk FHIR (do not change by hand)
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish sponsor or protocol names
        run: |
          for w in Madrigal TEMPO MGL-MA NILDA "Medical Affairs" SYNERGY Synergy Lilly etatrutide LY3437943; do
            if grep -rlF "$w" --include='*.html' --include='*.json' --include='*.txt' . ; then echo "BLOCKED: found \"$w\""; exit 1; fi
          done
      - name: Refuse to publish the old name (the brand is Kylo)
        run: |
          for f in $(find . -path ./.git -prune -o \( -name '*.html' -o -name '*.txt' -o -name '*.json' \) -print); do
            if grep -qi "idonea" "$f"; then echo "BLOCKED: found the old name in $f"; exit 1; fi
          done
      - name: Collect the site files
        run: mkdir _site && cp -r index.html signin.html kylo.css favicon.svg favicon-32.png apple-touch-icon.png robots.txt jwks.json privacy.html terms.html logo.png demo fonts _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
