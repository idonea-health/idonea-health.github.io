# Publishes this repo to https://idonea-health.github.io/ (Pages source: GitHub Actions). The product is Kylo (Kylo Health).
#   /            index.html: what Kylo is, how it works, where things stand
#   /demo/       the coordinator demo, built in idonea-mvp (ui/app) on made-up patients
#   /jwks.json   Kylo's public signing key for ModMed Bulk FHIR (do not change by hand)
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish sponsor or protocol names
        run: |
          for w in Madrigal TEMPO MGL-MA NILDA "Medical Affairs" SYNERGY Synergy Lilly etatrutide LY3437943; do
            if grep -rlF "$w" --include='*.html' --include='*.json' --include='*.txt' . ; then echo "BLOCKED: found \"$w\""; exit 1; fi
          done
      - name: Refuse to publish the old name (the brand is Kylo)
        run: |
          # The demo's internal browser storage key "idonea-trial1" is never shown and is the only allowed trace.
          for f in $(find . -path ./.git -prune -o \( -name '*.html' -o -name '*.txt' \) -print); do
            if sed 's/"idonea-trial1"//g' "$f" | grep -qi "idonea"; then echo "BLOCKED: found the old name in $f"; exit 1; fi
          done
      - name: Collect the site files
        run: mkdir _site && cp -r index.html robots.txt jwks.json privacy.html terms.html logo.png demo fonts img _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
